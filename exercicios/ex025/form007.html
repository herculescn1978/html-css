<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">

        <p>
            <label for="iest">Estado</label>
            <select name="estado" id="iest">
                <option value="--" selected>Escolha um estado.</option>
         
                    <optgroup label="Região Nordeste">
                        <option value="AL" >Alagoas</option>
                        <option value="PE">Pernambuco</option>
                        <option value="SE">Sergipe</option>
                    </optgroup>
                   
  
                    <optgroup label="Rergião Sudeste">
                        <option value="MG">Minas Gerais</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                    </optgroup>
                
            </select>
        </p>
        
        <p>
            <label for="iprof">Profissão:</label>
            <input type="text" name="prof" id="iprof" list="listprof">
            <datalist id="listprof">
                <option>Professor</option>
                <option>Administrador</option>
                <option value="DEV">Desenvolvedor</option>
                <option value="CONT">Contador</option>
            </datalist>
        </p>

        <p>
            <label for="imsg">Mensagem: </label> <br>
            <textarea name="msg" id="imsg" cols="50" rows="20"></textarea>
        </p>
     
        <P>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </P>

    </form>
    
</body>
</html>
